name: PHP checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check admin JavaScript syntax
        run: node --check assets/js/admin.js

  package:
    needs: [php-lint, js-syntax]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist/cogs-studio-for-woocommerce
          rsync -a ./ dist/cogs-studio-for-woocommerce/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist'
          cd dist
          zip -qr cogs-studio-for-woocommerce-v2.0.0.zip cogs-studio-for-woocommerce
      - uses: actions/upload-artifact@v4
        with:
          name: cogs-studio-for-woocommerce-v2.0.0
          path: dist/cogs-studio-for-woocommerce-v2.0.0.zip
          if-no-files-found: error
