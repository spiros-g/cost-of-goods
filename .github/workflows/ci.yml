name: PHP checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check admin JavaScript syntax
        run: node --check assets/js/admin.js

  package:
    needs: [php-lint, js-syntax, runtime-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve plugin version
        id: version
        run: |
          VERSION=$(php -r '$c=file_get_contents("cost-of-goods.php"); preg_match("/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([^\\r\\n]+)/m", $c, $m); echo trim($m[1] ?? "");')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist/cost-of-goods
          rsync -a ./ dist/cost-of-goods/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tests' \
            --exclude 'dist'
          cd dist
          zip -qr "cogs-studio-for-woocommerce-v${{ steps.version.outputs.version }}.zip" cost-of-goods
      - uses: actions/upload-artifact@v4
        with:
          name: cogs-studio-for-woocommerce-v${{ steps.version.outputs.version }}
          path: dist/cogs-studio-for-woocommerce-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  runtime-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        woocommerce: ['10.3.0', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: wp-cli
      - name: Install WordPress
        run: |
          mkdir -p /tmp/cogs-studio-wp
          cd /tmp/cogs-studio-wp
          wp core download --quiet
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp core install --url=http://localhost --title="COGS Studio CI" --admin_user=admin --admin_password=password --admin_email=ci@example.com --skip-email
      - name: Install WooCommerce
        run: |
          cd /tmp/cogs-studio-wp
          if [ "${{ matrix.woocommerce }}" = "latest" ]; then
            wp plugin install woocommerce --activate
          else
            wp plugin install woocommerce --version="${{ matrix.woocommerce }}" --activate
          fi
          wp option update woocommerce_feature_cost_of_goods_sold_enabled yes
      - name: Install COGS Studio
        run: |
          cd /tmp/cogs-studio-wp
          mkdir -p wp-content/plugins/cost-of-goods
          rsync -a "$GITHUB_WORKSPACE/" wp-content/plugins/cost-of-goods/ \
            --exclude '.git' \
            --exclude 'dist'
          wp plugin activate cost-of-goods
      - name: Run COGS runtime smoke test
        run: |
          cd /tmp/cogs-studio-wp
          wp eval-file wp-content/plugins/cost-of-goods/tests/smoke.php
