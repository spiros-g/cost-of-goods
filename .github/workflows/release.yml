name: Release

on:
  workflow_run:
    workflows: ["PHP checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify successful CI commit is still current main
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_SHA="$(git rev-parse HEAD)"
          echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TESTED_SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "$CURRENT_SHA" != "$TESTED_SHA" ]; then
              echo "Current main ($CURRENT_SHA) differs from tested commit ($TESTED_SHA); skipping stale release."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate version
        if: steps.gate.outputs.proceed == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(php -r '
            $c = file_get_contents("cogs-studio-for-woocommerce.php");
            preg_match("/^[[:space:]]*\\*[[:space:]]*Version:[[:space:]]*([^\\r\\n]+)/m", $c, $m);
            echo trim($m[1] ?? "");
          ')"

          STABLE_TAG="$(awk -F ': ' '/^Stable tag:/ {print $2; exit}' readme.txt | tr -d '\r')"

          test -n "$VERSION"

          if [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "Plugin header version ($VERSION) does not match readme stable tag ($STABLE_TAG)." >&2
            exit 1
          fi

          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        if: steps.gate.outputs.proceed == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production ZIP
        if: steps.gate.outputs.proceed == 'true' && steps.existing.outputs.exists == 'false'
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          ROOT="cogs-studio-for-woocommerce"
          ZIP="cogs-studio-for-woocommerce-v$VERSION.zip"

          rm -rf release-dist
          mkdir -p "release-dist/$ROOT"

          rsync -a ./ "release-dist/$ROOT/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'tests' \
            --exclude 'dist' \
            --exclude 'release-dist'

          (
            cd release-dist
            zip -qr "$ZIP" "$ROOT"
          )

          unzip -t "release-dist/$ZIP"
          unzip -l "release-dist/$ZIP" | grep "$ROOT/cogs-studio-for-woocommerce.php"
          ! unzip -l "release-dist/$ZIP" | grep -q "cost-of-goods.php"
          ! unzip -l "release-dist/$ZIP" | grep -q "/tests/"
          ! unzip -l "release-dist/$ZIP" | grep -q "/.github/"

          (
            cd release-dist
            sha256sum "$ZIP" > SHA256SUMS.txt
          )

          echo "zip=release-dist/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.gate.outputs.proceed == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"

          awk -v version="$VERSION" '
            $0 == "## " version {in_section=1; next}
            in_section && /^## / {exit}
            in_section {print}
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            cat > release-notes.md <<EOF
          COGS Studio for WooCommerce $VERSION

          Production release built automatically after the full main-branch CI suite passed.
          EOF
          fi

          cat >> release-notes.md <<EOF

          ---
          Release artifact is generated from commit ${{ steps.gate.outputs.sha }} after successful CI.
          EOF

      - name: Publish GitHub Release
        if: steps.gate.outputs.proceed == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ steps.gate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "${{ steps.package.outputs.zip }}" \
            "release-dist/SHA256SUMS.txt" \
            --target "$TARGET_SHA" \
            --title "COGS Studio for WooCommerce $TAG" \
            --notes-file release-notes.md \
            --latest
