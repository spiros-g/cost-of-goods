name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate version and tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$c=file_get_contents("cogs-studio-for-woocommerce.php"); preg_match("/Version:[[:space:]]*([^\\r\\n]+)/",$c,$m); echo trim($m[1]??"");')"
          STABLE="$(awk -F ': ' '/^Stable tag:/ {print $2; exit}' readme.txt | tr -d '\r')"
          test -n "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION" = "$STABLE"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ROOT="cogs-studio-for-woocommerce"
          ZIP="sg-cost-manager-v${VERSION}.zip"
          rm -rf release-dist
          mkdir -p "release-dist/$ROOT"
          rsync -a ./ "release-dist/$ROOT/" --exclude '.git' --exclude '.github' --exclude 'tests' --exclude 'dist' --exclude 'release-dist' --exclude '*.zip'
          (cd release-dist && zip -qr "$ZIP" "$ROOT")
          unzip -t "release-dist/$ZIP"
          unzip -l "release-dist/$ZIP" | grep "$ROOT/cogs-studio-for-woocommerce.php"
          (cd release-dist && sha256sum "$ZIP" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SG Cost Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-dist/sg-cost-manager-v*.zip
            release-dist/SHA256SUMS.txt